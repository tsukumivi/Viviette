<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101116" />
    <title>Viviette</title>
  </head>
  <body>
    <div class="app-shell">
      <svg class="riff-icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <symbol id="riff-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></symbol>
        <symbol id="riff-discover" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor"/></symbol>
        <symbol id="riff-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
        <symbol id="riff-settings" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></symbol>
        <symbol id="riff-youtube" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></symbol>
        <symbol id="riff-soundcloud" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M11.5 14.5c0 .28-.22.5-.5.5s-.5-.22-.5-.5v-4c0-.28.22-.5.5-.5s.5.22.5.5v4zm-2 0c0 .28-.22.5-.5.5s-.5-.22-.5-.5v-3c0-.28.22-.5.5-.5s.5.22.5.5v3zm-2 0c0 .28-.22.5-.5.5s-.5-.22-.5-.5v-2c0-.28.22-.5.5-.5s.5.22.5.5v2zm-2 0c0 .28-.22.5-.5.5s-.5-.22-.5-.5v-1c0-.28.22-.5.5-.5s.5.22.5.5v1zm14.5-.5c0 1.93-1.57 3.5-3.5 3.5H13V9.1c.7-.6 1.6-1.1 2.6-1.1 2.2 0 4.1 1.6 4.4 3.8.3-.2.7-.3 1-.3 1.4 0 2.5 1.1 2.5 2.5z"/></symbol>
        <symbol id="riff-spotify" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M6.5 9c3.8-1.2 8.4-.8 11.5 1.1M7.5 12c3.1-.9 6.9-.6 9.5.9M8.4 15c2.3-.6 5-.3 6.9.8"/></symbol>
        <symbol id="riff-live" viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42m-9.88 9.88-1.42 1.42"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
        <symbol id="riff-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="riff-download" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z" fill="currentColor" stroke="none"/></symbol>
        <symbol id="riff-playlist-add" viewBox="0 0 24 24"><path d="M21 15V6M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM12 12H3M16 6H3M12 18H3"/></symbol>
        <symbol id="riff-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></symbol>
        <symbol id="riff-shuffle" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></symbol>
        <symbol id="riff-previous" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"/><line x1="5" y1="19" x2="5" y2="5" stroke-width="2.5"/></symbol>
        <symbol id="riff-play" viewBox="0 0 24 24"><polygon points="8 5 19 12 8 19" fill="currentColor" stroke="none"/></symbol>
        <symbol id="riff-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
        <symbol id="riff-next" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19" stroke-width="2.5"/></symbol>
        <symbol id="riff-repeat" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
        <symbol id="riff-lyrics" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
        <symbol id="riff-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11m3-3 3 3-3 3"/></symbol>
        <symbol id="riff-volume" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
        <symbol id="riff-volume-muted" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></symbol>
        <symbol id="riff-interface" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></symbol>
        <symbol id="riff-integrations" viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></symbol>
        <symbol id="riff-audio-output" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v3a6 6 0 0 0 12 0V9a6 6 0 0 0-6-6Zm-9 9v1a9 9 0 0 0 18 0v-1M12 21v-3"/></symbol>
        <symbol id="riff-quality" viewBox="0 0 24 24"><path d="M12 3v18m0-18 7 4v10l-7 4-7-4V7l7-4Z"/></symbol>
        <symbol id="riff-lock" viewBox="0 0 24 24"><path d="M8 10V7a4 4 0 0 1 8 0v3m-9 0h10a2 2 0 0 1 2 2v7H5v-7a2 2 0 0 1 2-2Z"/></symbol>
        <symbol id="riff-discord" viewBox="0 0 127.14 96.36"><path fill="currentColor" stroke="none" d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.19 0A72.37 72.37 0 0 0 45.56 0 105.89 105.89 0 0 0 19.32 8.09C2.73 32.66-1.77 56.62.48 80.25A105.73 105.73 0 0 0 32.71 96.36a77.7 77.7 0 0 0 6.9-11.15 68.42 68.42 0 0 1-10.86-5.18c.91-.66 1.8-1.34 2.66-2.04a75.72 75.72 0 0 0 64.32 0c.87.7 1.76 1.38 2.66 2.04a68.68 68.68 0 0 1-10.88 5.19 77 77 0 0 0 6.9 11.14 105.25 105.25 0 0 0 32.25-16.12c2.65-27.4-4.52-51.14-18.96-72.17ZM42.45 65.69c-6.28 0-11.44-5.75-11.44-12.81s5.05-12.82 11.44-12.82 11.55 5.81 11.44 12.82c0 7.06-5.05 12.81-11.44 12.81Zm42.24 0c-6.28 0-11.44-5.75-11.44-12.81s5.05-12.82 11.44-12.82 11.55 5.81 11.44 12.82c0 7.06-5.05 12.81-11.44 12.81Z"/></symbol>
        <symbol id="riff-close" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
        <symbol id="riff-chevron-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
        <symbol id="riff-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
        <symbol id="riff-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/></symbol>
        <symbol id="riff-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 18c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2Zm12-2c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2Z"/></symbol>
      </svg>
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Viviette home">
          <span class="brand-mark" aria-hidden="true">V</span>
          <span class="brand-name">Viviette</span>
        </a>

        <label class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#riff-search"/></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search your music" aria-label="Search tracks, artists, and albums" />
          <kbd>Ctrl K</kbd>
        </label>

        <div class="source-switch" role="group" aria-label="Search provider">
          <button class="source-option is-selected" type="button" data-source="youtube" aria-label="YouTube" aria-pressed="true" title="Sign in to YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#riff-youtube"/></svg><span>YouTube</span><span class="source-connection-indicator" aria-hidden="true"></span></button>
          <button class="source-option" type="button" data-source="soundcloud" aria-label="SoundCloud" aria-pressed="false" title="Sign in to SoundCloud"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#riff-soundcloud"/></svg><span>SoundCloud</span><span class="source-connection-indicator" aria-hidden="true"></span></button>
          <button class="source-option" type="button" data-source="live" aria-label="Live Performances" aria-pressed="false" title="Search concert recordings with a connected provider"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#riff-live"/></svg><span>Live Performances</span></button>
          <button class="source-option" type="button" data-source="spotify" aria-label="Spotify" aria-pressed="false" title="Sign in to Spotify"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#riff-spotify"/></svg><span>Spotify</span><span class="source-connection-indicator" aria-hidden="true"></span></button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="Primary navigation">
          <nav class="sidebar-nav" aria-label="Main navigation">
            <button class="nav-item active" type="button" data-view="home" aria-label="Discover" title="Discover"><span class="nav-indicator"><svg viewBox="0 0 24 24"><use href="#riff-discover"/></svg></span><span class="nav-tooltip">Discover</span></button>
            <button class="nav-item" type="button" data-view="liked" aria-label="Liked songs" title="Liked Songs"><span class="nav-indicator"><svg viewBox="0 0 24 24"><use href="#riff-heart"/></svg><span class="nav-count" id="likedCount">0</span></span><span class="nav-tooltip">Liked Songs</span></button>
            <div class="rail-divider" aria-hidden="true"></div>
            <button class="nav-item settings-link" type="button" data-view="settings" aria-label="Settings" title="Settings"><span class="nav-indicator"><svg viewBox="0 0 24 24"><use href="#riff-settings"/></svg></span><span class="nav-tooltip">Settings</span></button>
          </nav>
        </aside>
        <main class="main-content" id="mainContent" tabindex="-1"></main>
      </div>

      <footer class="player-bar" aria-label="Playback controls">
        <section class="player-track" aria-label="Selected track">
          <div class="mini-art art-starlight" id="miniArt" aria-hidden="true"></div>
          <div class="mini-copy"><span class="mini-title" id="miniTitle">Nothing playing</span><span class="mini-artist" id="miniArtist">Import local music to get started</span></div>
          <div class="track-actions">
            <button class="icon-button player-icon" id="likeButton" type="button" aria-label="Like" aria-pressed="false" data-tooltip="Like"><svg viewBox="0 0 24 24"><use href="#riff-heart"/></svg></button>
            <button class="icon-button player-icon" id="downloadButton" type="button" aria-label="Download MP3" data-tooltip="Download MP3"><svg viewBox="0 0 24 24"><use href="#riff-download"/></svg></button>
            <button class="icon-button player-icon" id="playlistButton" type="button" aria-label="Add to playlist" aria-expanded="false" aria-controls="playlistMenu" data-tooltip="Add to playlist"><svg viewBox="0 0 24 24"><use href="#riff-playlist-add"/></svg></button>
            <button class="icon-button player-icon more-button" id="moreButton" type="button" aria-label="More track actions" aria-expanded="false" aria-controls="trackMenu" data-tooltip="More track actions"><svg viewBox="0 0 24 24"><use href="#riff-more"/></svg></button>
          </div>
        </section>

        <section class="player-center" aria-label="Track transport">
          <div class="transport-row">
            <button class="icon-button transport-icon" type="button" data-transport="shuffle" aria-label="Shuffle" data-tooltip="Shuffle"><svg viewBox="0 0 24 24"><use href="#riff-shuffle"/></svg></button>
            <button class="icon-button transport-icon" type="button" data-transport="previous" aria-label="Previous track" data-tooltip="Previous"><svg viewBox="0 0 24 24"><use href="#riff-previous"/></svg></button>
            <button class="play-button" type="button" data-transport="play" aria-label="Play" title="Connect a provider to play"><svg viewBox="0 0 24 24"><use href="#riff-play"/></svg></button>
            <button class="icon-button transport-icon" type="button" data-transport="next" aria-label="Next track" data-tooltip="Next"><svg viewBox="0 0 24 24"><use href="#riff-next"/></svg></button>
            <button class="icon-button transport-icon" type="button" data-transport="repeat" aria-label="Repeat off" data-tooltip="Repeat off"><svg viewBox="0 0 24 24"><use href="#riff-repeat"/></svg></button>
          </div>
          <div class="timeline-row"><span class="time-label" id="elapsedTime">0:00</span><input class="timeline-slider" id="seekSlider" type="range" min="0" max="1000" value="0" aria-label="Seek through track" disabled><span class="time-label" id="totalTime">0:00</span></div>
        </section>

        <section class="player-extras" aria-label="More playback options">
          <button class="icon-button player-icon" type="button" data-player-extra="lyrics" aria-label="Lyrics" data-tooltip="Lyrics"><svg viewBox="0 0 24 24"><use href="#riff-lyrics"/></svg></button>
          <button class="icon-button player-icon queue-button" type="button" data-player-extra="queue" aria-label="Queue" data-tooltip="Queue"><svg viewBox="0 0 24 24"><use href="#riff-queue"/></svg></button>
          <button class="icon-button player-icon volume-button" id="volumeToggle" type="button" aria-label="Mute volume" data-tooltip="Mute volume"><svg viewBox="0 0 24 24"><use href="#riff-volume"/></svg></button>
          <input class="volume-slider" id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.72" aria-label="Volume">
        </section>
      </footer>

      <div class="popover playlist-menu" id="playlistMenu" hidden>
        <div class="popover-label">ADD TO PLAYLIST</div>
        <div id="playlistOptions"></div>
        <button class="create-playlist-option" id="createPlaylistOption" type="button"><span class="plus">+</span><span>Create playlist</span></button>
      </div>

      <div class="popover track-menu" id="trackMenu" hidden>
        <div class="popover-label">TRACK ACTIONS</div>
        <button class="track-menu-option" id="notLikedOption" type="button"><svg viewBox="0 0 24 24"><use href="#riff-ban"/></svg><span>Mark as not liked</span></button>
      </div>

      <dialog class="create-dialog" id="createDialog" aria-labelledby="dialogTitle">
        <form id="createPlaylistForm">
          <div class="dialog-kicker">YOUR LIBRARY</div>
          <h2 id="dialogTitle">Create a playlist</h2>
          <label for="playlistName">Name</label>
          <input id="playlistName" name="playlistName" maxlength="48" placeholder="Give it a name" required />
          <div class="dialog-actions"><button class="button-quiet" id="cancelCreate" type="button">Cancel</button><button class="button-primary" type="submit">Create</button></div>
        </form>
      </dialog>

      <dialog class="create-dialog provider-dialog" id="providerDialog" aria-labelledby="providerDialogTitle">
        <div id="providerDialogBody"></div>
      </dialog>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <input id="audioFiles" type="file" accept="audio/*,.flac,.wav,.opus,.aac,.alac,.dsf,.dff,.mp3" multiple hidden>
      <audio id="audioElement" preload="metadata"></audio>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
