name: Verify Viviette

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check Rust backend
        shell: pwsh
        run: |
          $cargoOutput = & cargo check --manifest-path src-tauri/Cargo.toml --message-format=short 2>&1
          $cargoExitCode = $LASTEXITCODE
          $cargoOutput | ForEach-Object { Write-Output $_ }
          if ($cargoExitCode -ne 0) {
            $diagnostics = $cargoOutput | Select-Object -Last 60 | ForEach-Object {
              $line = $_.ToString() -replace '\x1b\[[0-9;]*[A-Za-z]', ''
              $line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            }
            $message = [string]::Join('%0A', $diagnostics)
            Write-Output "::error title=Rust backend diagnostics::Cargo exited with code $cargoExitCode.%0A$message"
          }
          exit $cargoExitCode
