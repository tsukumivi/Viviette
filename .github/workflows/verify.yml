name: Verify Viviette

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check Rust backend
        shell: pwsh
        run: |
          $cargoOutput = & cargo check --manifest-path src-tauri/Cargo.toml --message-format=short 2>&1
          $cargoExitCode = $LASTEXITCODE
          $cargoOutput | ForEach-Object { Write-Output $_ }
          if ($cargoExitCode -ne 0) {
            $cargoOutput |
              Where-Object { $_.ToString() -match '(?i)(^|\s)error(?:\[[^\]]+\])?:|failed to' } |
              Select-Object -First 12 |
              ForEach-Object {
                $message = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error::$message"
              }
          }
          exit $cargoExitCode
