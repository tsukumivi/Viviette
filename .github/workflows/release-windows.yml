name: Windows desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Validate provider configuration
        shell: pwsh
        env:
          VIVIETTE_YOUTUBE_CLIENT_ID: ${{ vars.VIVIETTE_YOUTUBE_CLIENT_ID }}
          VIVIETTE_SPOTIFY_CLIENT_ID: ${{ vars.VIVIETTE_SPOTIFY_CLIENT_ID }}
          VIVIETTE_SOUNDCLOUD_CLIENT_ID: ${{ vars.VIVIETTE_SOUNDCLOUD_CLIENT_ID }}
          VIVIETTE_SOUNDCLOUD_TOKEN_BROKER_URL: ${{ vars.VIVIETTE_SOUNDCLOUD_TOKEN_BROKER_URL }}
        run: |
          $required = @(
            "VIVIETTE_YOUTUBE_CLIENT_ID",
            "VIVIETTE_SPOTIFY_CLIENT_ID",
            "VIVIETTE_SOUNDCLOUD_CLIENT_ID",
            "VIVIETTE_SOUNDCLOUD_TOKEN_BROKER_URL"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) { throw "Configure these GitHub Actions variables before publishing: $($missing -join ', ')" }
      - name: Build the Windows setup package
        run: pnpm tauri build --bundles nsis
        env:
          VIVIETTE_YOUTUBE_CLIENT_ID: ${{ vars.VIVIETTE_YOUTUBE_CLIENT_ID }}
          VIVIETTE_SPOTIFY_CLIENT_ID: ${{ vars.VIVIETTE_SPOTIFY_CLIENT_ID }}
          VIVIETTE_SOUNDCLOUD_CLIENT_ID: ${{ vars.VIVIETTE_SOUNDCLOUD_CLIENT_ID }}
          VIVIETTE_SOUNDCLOUD_TOKEN_BROKER_URL: ${{ vars.VIVIETTE_SOUNDCLOUD_TOKEN_BROKER_URL }}
      - name: Prepare the stable installer name and checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri did not produce an NSIS setup executable." }
          Copy-Item -LiteralPath $installer.FullName -Destination "Viviette-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "Viviette-Setup.exe").Hash.ToLowerInvariant()
          "$hash  Viviette-Setup.exe" | Set-Content -Encoding ascii "SHA256SUMS.txt"
      - name: Publish the tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @'
          Windows desktop installer for Viviette. Installs for the current Windows user and does not require administrator access.

          Provider sign-in opens on each provider's official website; Viviette never receives provider passwords. Search requires an authorized provider account. Google, Spotify, and SoundCloud app settings must be configured by maintainers. SoundCloud uses a separate HTTPS token broker so its client secret is never bundled in the installer. Account tokens are stored in Windows Credential Manager.

          YouTube playback uses its visible official player; SoundCloud uses its official widget when configured; Spotify search results open in Spotify. These provider players are not yet connected to Viviette's bottom playback bar or Discord Rich Presence. The bottom player and pause-aware Discord timestamp work with imported local tracks.

          Verify Viviette-Setup.exe with SHA256SUMS.txt.
          '@
          gh release create $tag "Viviette-Setup.exe" "SHA256SUMS.txt" --title "Viviette $tag" --notes $notes
